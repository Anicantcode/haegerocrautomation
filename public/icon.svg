<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#grad)" stroke-width="10"/>
  
  <!-- Document Sheet -->
  <rect x="130" y="100" width="252" height="312" rx="20" fill="#1e293b" stroke="#475569" stroke-width="6"/>
  
  <!-- Document Lines -->
  <line x1="175" y1="160" x2="335" y2="160" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  <line x1="175" y1="200" x2="300" y2="200" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <line x1="175" y1="240" x2="335" y2="240" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Scanner Beam -->
  <rect x="100" y="270" width="312" height="8" rx="4" fill="#38bdf8"/>
  <rect x="110" y="260" width="292" height="28" rx="6" fill="#38bdf8" opacity="0.25"/>
  
  <!-- Extracted Number Box -->
  <rect x="160" y="320" width="192" height="56" rx="14" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="4"/>
  <text x="256" y="358" font-family="monospace, sans-serif" font-size="28" font-weight="bold" fill="#38bdf8" text-anchor="middle">DN SCAN</text>
  
  <!-- Corner Reticles -->
  <path d="M 80,140 L 80,90 L 130,90" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 432,140 L 432,90 L 382,90" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 80,372 L 80,422 L 130,422" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 432,372 L 432,422 L 382,422" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
